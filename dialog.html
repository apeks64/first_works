<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
      }
      .person {
        margin: 5px 0;
      }
      .controls {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
      <label for="selectAll">Tümünü Seç / Kaldır</label>
    </div>
    <div id="personnelList"></div>
    <br>
    <button onclick="createDocuments()">Seçilenler için Belge Oluştur</button>

    <script>
      let personnelData = [];

      function toggleSelectAll(source) {
        const checkboxes = document.querySelectorAll('input[name="personel"]');
        checkboxes.forEach(cb => cb.checked = source.checked);
      }

      function loadPersonnel() {
        google.script.run.withSuccessHandler(function(data) {
          personnelData = data;
          const listDiv = document.getElementById('personnelList');
          listDiv.innerHTML = '';

          data.forEach((p, index) => {
            const div = document.createElement('div');
            div.className = 'person';
            div.innerHTML = `<input type="checkbox" name="personel" id="person_${index}" value="${index}">
                             <label for="person_${index}">${p[3]} ${p[4]}</label>`; // Adı + Soyadı
            listDiv.appendChild(div);
          });
        }).getPersonnelData();
      }

      function createDocuments() {
        const selected = [];
        const checkboxes = document.querySelectorAll('input[name="personel"]:checked');
        
        checkboxes.forEach(cb => {
          const index = parseInt(cb.value, 10);
          selected.push(personnelData[index]);
        });

        if (selected.length === 0) {
          alert('Lütfen en az bir personel seçin.');
          return;
        }

        google.script.run.withSuccessHandler(function(links) {
          let msg = 'Oluşturulan belgeler:\n\n';
          links.forEach(link => {
            msg += link + '\n';
          });
          alert(msg);
        }).createDocument(selected);
      }

      // Sayfa yüklenince personelleri getir
      window.onload = loadPersonnel;
    </script>
  </body>
</html>
