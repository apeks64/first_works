<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: sans-serif; }
    #filterInput { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    #dataList { max-height: 250px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; margin-bottom: 10px; }
    .selectItem { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
    button { padding: 8px 12px; margin-right: 5px; cursor: pointer; }
    .button-group { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .delete-buttons { margin-top: 15px; }
    .warning-message { font-weight: bold; color: #d63300; padding: 10px; border: 1px solid #d63300; border-radius: 5px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h3>Eski Kayıtları Sil</h3>
  <div class="warning-message">
    Lütfen işlemi biten ve kendinize ait olan firmalara ait verileri siliniz!
  </div>
  <p>7 günden eski kayıtlara sahip firmaları seçerek silebilirsiniz.</p>
  <input type="text" id="filterInput" placeholder="Firma Adı Filtrele..." oninput="filterData()">

  <div class="button-group">
    <button onclick="selectAll()">Tümünü Seç</button>
    <button onclick="selectFiltered()">Filtrelenenleri Seç</button>
    <button onclick="deselectAll()">Tümünü Kaldır</button>
  </div>
  
  <div id="dataList"></div>
  
  <div class="delete-buttons">
    <button onclick="submitOldRecordsDeletion()">Seçili Firmaların Eski Kayıtlarını Sil</button>
    <button onclick="submitAllRecordsDeletion()">Seçili Firmaların TÜM Kayıtlarını Sil</button>
  </div>

  <script>
    let allFirms = [];

    function filterData() {
      let input = document.getElementById("filterInput").value.toLowerCase();
      let items = document.querySelectorAll("#dataList .selectItem");
      
      items.forEach(item => {
        let firmName = item.querySelector("label").textContent.toLowerCase();
        if (firmName.includes(input)) {
          item.style.display = "flex";
        } else {
          item.style.display = "none";
        }
      });
    }

    function selectAll() {
      document.querySelectorAll("#dataList input").forEach(el => el.checked = true);
    }

    function selectFiltered() {
      document.querySelectorAll("#dataList .selectItem").forEach(item => {
        if (item.style.display !== "none") {
          item.querySelector("input").checked = true;
        }
      });
    }

    function deselectAll() {
      document.querySelectorAll("#dataList input").forEach(el => el.checked = false);
    }
    
    function updateList(firms) {
      allFirms = firms;
      let dataList = document.getElementById("dataList");
      dataList.innerHTML = '';
      if (allFirms.length === 0) {
        dataList.innerHTML = '<p>Silinebilecek eski kayıt bulunmuyor.</p>';
      } else {
        allFirms.forEach(firm => {
          let div = document.createElement("div");
          div.classList.add("selectItem");
          div.innerHTML = `<input type="checkbox" value="${firm}" id="${firm}"><label for="${firm}">${firm}</label>`;
          dataList.appendChild(div);
        });
      }
      filterData();
    }

    function submitOldRecordsDeletion() {
      let selectedValues = Array.from(document.querySelectorAll("#dataList input:checked"))
        .map(input => input.value);
      
      if (selectedValues.length === 0) {
        alert("Lütfen silmek istediğiniz firmaları seçin.");
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(updatedFirms) {
          alert("Seçilen firmaların eski kayıtları başarıyla silindi. Liste yenileniyor.");
          updateList(updatedFirms);
        })
        .withFailureHandler(function(error) {
          alert("Hata: " + error.message);
        })
        .deleteOldRecords(selectedValues);
    }

    function submitAllRecordsDeletion() {
      let selectedValues = Array.from(document.querySelectorAll("#dataList input:checked"))
        .map(input => input.value);
      
      if (selectedValues.length === 0) {
        alert("Lütfen silmek istediğiniz firmaları seçin.");
        return;
      }
      
      if (!confirm("Seçili firmalara ait TÜM kayıtlar silinecek. Emin misiniz?")) {
        return;
      }

      google.script.run
        .withSuccessHandler(function(updatedFirms) {
          alert("Seçilen firmaların tüm kayıtları başarıyla silindi. Liste yenileniyor.");
          updateList(updatedFirms);
        })
        .withFailureHandler(function(error) {
          alert("Hata: " + error.message);
        })
        .deleteAllRecords(selectedValues);
    }

    google.script.run.withSuccessHandler(updateList).getUniqueOldFirms();
  </script>
</body>
</html>
