<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"], select {
        width: calc(100% - 22px);
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      input[type="text"][disabled] {
        background-color: #f0f0f0;
        cursor: not-allowed;
      }
      .date-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
      }
      .date-container {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 5px;
      }
      .date-container input[type="text"] {
        flex-grow: 1;
        margin-right: 0;
        cursor: pointer;
      }
      .hours-container {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .hours-container input {
        flex-grow: 1;
      }
      .hours-container label {
        flex-shrink: 0;
        margin-bottom: 0;
      }
      .date-group .disabled-input {
        background-color: #e9e9e9;
      }
      .date-button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      .date-button:disabled {
        background-color: #c0c0c0;
        cursor: not-allowed;
      }
      #firmSearchBox {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      #firmList {
        width: 100%;
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid #ccc;
        margin-top: 5px;
        box-sizing: border-box;
        display: none;
      }
      .firm-option {
        padding: 8px;
        cursor: pointer;
      }
      .firm-option:hover {
        background-color: #eee;
      }
      button {
        background-color: #008CBA;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
      button:hover {
        background-color: #007bb5;
      }
      #resultMessage {
        margin-top: 10px;
      }
      #resultMessage p {
          font-weight: bold;
          margin-bottom: 5px;
      }
      #resultMessage a {
        display: inline-block;
      }
      #progressMessage {
        margin-top: 15px;
        color: #333;
        font-style: italic;
      }
      .checkbox-container {
        border: 1px solid #ddd;
        padding: 10px;
        max-height: 300px;
        overflow-y: auto;
        margin-bottom: 4px; /* Boşluk azaltıldı */
        background-color: #fff;
        border-radius: 4px;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        margin-bottom: 2px;
        padding: 2px 0;
      }
      .checkbox-item input[type="checkbox"] {
        width: auto;
        margin: 0 8px 0 0;
        position: relative;
        top: -1px;
      }
      .checkbox-item label {
        font-weight: normal;
        margin-bottom: 0;
        cursor: pointer;
        flex-grow: 1;
        color: #333;
        font-size: 13px;
      }
      .action-buttons {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px; /* Boşluk azaltıldı */
        gap: 10px;
      }
      .action-buttons button {
        width: 48%;
        padding: 8px 12px;
        font-size: 14px;
        margin-top: 0;
        background-color: #6c757d;
      }
      .action-buttons button:hover {
        background-color: #5a6268;
      }
      .two-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .date-row-group {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .date-row-group .date-container, .date-row-group .hours-container, .date-row-group .validity-container {
        flex-grow: 1;
        margin-bottom: 0;
        display: flex;
        align-items: center;
      }
      .date-row-group .validity-container input {
        flex-grow: 1;
      }
      .date-row-group label {
        flex-shrink: 0;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Sertifika Oluştur</h2>
    <form id="certificateForm">

      <label for="firmSearchBox">Firma Ara:</label><br>
      <input type="text" id="firmSearchBox" placeholder="Firma adı girin..." autocomplete="off"><br>
      <div id="firmList"></div><br>
      <input type="hidden" id="selectedFirm" name="selectedFirm">

      <label for="rowNumbers">Satır Numaraları (ör: 14,15,25-29):</label>
      <input type="text" id="rowNumbers" name="rowNumbers" required placeholder="Örnek: 14,15,25-29">
    
      <label>Eğitim Konuları:</label>
      <div id="trainingTopicCheckboxes" class="checkbox-container two-columns">
        <p style="text-align: center; color: #777;">Konular yükleniyor...</p>
      </div>
      <div class="action-buttons">
        <button type="button" onclick="selectAllTopics()">Tümünü Seç</button>
        <button type="button" onclick="clearAllTopics()">Tümünü Kaldır</button>
      </div>

      <label>Şablonlar:</label>
      <div id="templatesCheckboxes" class="checkbox-container two-columns">
        <p style="text-align: center; color: #777;">Şablonlar yükleniyor...</p>
      </div>
      <div class="action-buttons">
        <button type="button" onclick="selectAllTemplates()">Tümünü Seç</button>
        <button type="button" onclick="clearAllTemplates()">Tümünü Kaldır</button>
      </div>

      <label>Tarihler ve Saatler:</label><br>
      
      <div class="date-row-group">
        <div class="date-container">
          <label>1. Gün:</label>
          <input type="text" id="date1" name="date1" required placeholder="GG/AA/YYYY">
          <button type="button" class="date-button" onclick="changeDate('date1', -1)">&lt;</button>
          <button type="button" class="date-button" onclick="changeDate('date1', 1)">&gt;</button>
        </div>
        <div class="hours-container">
          <label>Saat:</label>
          <input type="text" id="trainingHours1" name="trainingHours1" placeholder="Eğitim saati">
        </div>
        <div class="validity-container">
          <label>Geç. Tarihi:</label>
          <input type="text" id="date2" name="date2" disabled class="disabled-input">
        </div>
      </div>

      <div class="date-row-group">
        <div class="date-container">
          <label>2. Gün:</label>
          <input type="text" id="date3" name="date3" placeholder="GG/AA/YYYY">
          <button type="button" class="date-button" onclick="changeDate('date3', -1)">&lt;</button>
          <button type="button" class="date-button" onclick="changeDate('date3', 1)">&gt;</button>
        </div>
        <div class="hours-container">
          <label>Saat:</label>
          <input type="text" id="trainingHours2" name="trainingHours2" placeholder="Eğitim saati">
        </div>
        <div class="validity-container">
          <label>Geç. Tarihi:</label>
          <input type="text" id="date4" name="date4" disabled class="disabled-input">
        </div>
      </div>

      <div class="date-row-group">
        <div class="date-container">
          <label>3. Gün:</label>
          <input type="text" id="date5" name="date5" placeholder="GG/AA/YYYY">
          <button type="button" class="date-button" onclick="changeDate('date5', -1)">&lt;</button>
          <button type="button" class="date-button" onclick="changeDate('date5', 1)">&gt;</button>
        </div>
        <div class="hours-container">
          <label>Saat:</label>
          <input type="text" id="trainingHours3" name="trainingHours3" placeholder="Eğitim saati">
        </div>
        <div class="validity-container">
          <label>Geç. Tarihi:</label>
          <input type="text" id="date6" name="date6" disabled class="disabled-input">
        </div>
      </div>
      
      <button type="submit">Sertifika Oluştur</button>
    </form>

    <div id="progressMessage" style="display:none;"></div>
    
    <div id="resultMessage" style="display:none;">
        <p></p>
        <a href="https://drive.google.com/drive/folders/1yrwxxbb7WA2MxQ0UoZ5LN9jJahOaD5Uq" target="_blank">Sertifikalarınızı buradan görüntüleyebilirsiniz.</a><br>
        <a href="https://script.google.com/macros/s/AKfycby0speUpHZz1BwVuz_qvrIud0VyPAHhVvtSI7GMXnDNE2rqSQJfU2nXkfX35a4zDV3E/exec" target="_blank">İSG Belge Yönetimi için TIKLAYINIZ.</a>
    </div>

    <script>
      let allFirms = [];
      let selectedFirmExact = "";

      google.script.run.withSuccessHandler(function(firms) {
        allFirms = firms;
      }).getFirmList();
      google.script.run.withSuccessHandler(function(titles) {
        const div = document.getElementById('trainingTopicCheckboxes');
        if (titles.length === 0) {
            div.innerHTML = "<p style='text-align: center; color: #777;'>Konular yüklenirken hata oluştu veya 'EGITIM' sayfası boş.</p>";
            return;
        }
        div.innerHTML = "";
        titles.forEach(title => {
          const 
          checkboxContainer = document.createElement("div");
          checkboxContainer.className = "checkbox-item";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "trainingTopic";
          checkbox.value = title;
          const label = document.createElement("label");
          label.textContent = title;
  
          label.htmlFor = 
          checkbox.id;
          label.onclick = () => checkbox.click();
          checkboxContainer.appendChild(checkbox);
          checkboxContainer.appendChild(label);
          div.appendChild(checkboxContainer);
 });
      }).getTrainingTopicTitles();

      google.script.run.withSuccessHandler(function(templates) {
          const div = document.getElementById('templatesCheckboxes');
          if (templates.length === 0) {
              div.innerHTML = "<p style='text-align: center; color: #777;'>Şablonlar yüklenirken hata oluştu.</p>";
              return;
          }
          div.innerHTML = "";
          templates.forEach(template => {
              const checkboxContainer = document.createElement("div");
              checkboxContainer.className = "checkbox-item";
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.name = "templates";
              checkbox.value = template.id;
              const label = document.createElement("label");
              label.textContent = template.name;
              label.htmlFor = checkbox.id;
              label.onclick = () => checkbox.click();
              checkboxContainer.appendChild(checkbox);
              checkboxContainer.appendChild(label);
              div.appendChild(checkboxContainer);
          });
      }).getTemplateData();

      function selectAllTopics() {
        document.querySelectorAll('#trainingTopicCheckboxes input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = true;
        });
      }

      function clearAllTopics() {
        document.querySelectorAll('#trainingTopicCheckboxes input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = false;
        });
      }

      function selectAllTemplates() {
        document.querySelectorAll('#templatesCheckboxes input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = true;
        });
      }

      function clearAllTemplates() {
        document.querySelectorAll('#templatesCheckboxes input[type="checkbox"]').forEach(checkbox => {
          checkbox.checked = false;
        });
      }

      function formatDateToDDMMYYYY(date) {
        const d = new Date(date);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      }

      function parseDateFromDDMMYYYY(dateString) {
        if (!dateString) return null;
        const parts = dateString.split('/');
        if (parts.length === 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            return new Date(year, month, day);
        }
        return null;
      }
      
      function updateDependentDates(hazardYears) {
        try {
            const date1 = document.getElementById('date1').value;
            const date3 = document.getElementById('date3').value;
            const date5 = document.getElementById('date5').value;
            
            if(date1) {
              const d1 = parseDateFromDDMMYYYY(date1);
              const d2 = new Date(d1); d2.setFullYear(d2.getFullYear() + hazardYears);
              document.getElementById('date2').value = formatDateToDDMMYYYY(d2);
            } else {
              document.getElementById('date2').value = '';
            }

            if(date3) {
              const d3 = parseDateFromDDMMYYYY(date3);
              const d4 = new Date(d3); d4.setFullYear(d4.getFullYear() + hazardYears);
              document.getElementById('date4').value = formatDateToDDMMYYYY(d4);
            } else {
              document.getElementById('date4').value = '';
            }

            if(date5) {
              const d5 = parseDateFromDDMMYYYY(date5);
              const d6 = new Date(d5); d6.setFullYear(d6.getFullYear() + hazardYears);
              document.getElementById('date6').value = formatDateToDDMMYYYY(d6);
            } else {
              document.getElementById('date6').value = '';
            }
            
        } catch (e) {
            console.error("Tarih güncelleme hatası:", e);
        }
      }

      function changeDate(elementId, days) {
        const input = document.getElementById(elementId);
        let currentDate = parseDateFromDDMMYYYY(input.value);

        if (days === 1) { 
          currentDate = getNextBusinessDay(currentDate);
        } else if (days === -1) { 
          currentDate = getPreviousBusinessDay(currentDate);
        }
        input.value = formatDateToDDMMYYYY(currentDate);
        // Tehlike sınıfına göre tarihleri güncelle
        const firmName = document.getElementById('selectedFirm').value;
        if (firmName) {
            google.script.run.withSuccessHandler(updateDependentDates).getHazardYearsForFirm(firmName);
        } else {
            updateDependentDates(1); // Firma seçilmezse varsayılan 1 yıl
        }
      }

      function getNextBusinessDay(date) {
        let d = new Date(date);
        do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
        return d;
      }
      function getPreviousBusinessDay(date) {
        let d = new Date(date);
        do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6);
        return d;
      }
      
      // Firm search normalization
      function normalizeString(str) {
        return str.toLowerCase().replace(/ç/g, 'c').replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ü/g, 'u').trim();
      }

      document.getElementById("firmSearchBox").addEventListener("input", function() {
        const filter = normalizeString(this.value);
        const firmListDiv = document.getElementById("firmList");
        firmListDiv.innerHTML = "";
        selectedFirmExact = "";
        if (filter.length === 0) {
          firmListDiv.style.display = 'none';
          document.getElementById("selectedFirm").value = "";
          updateDependentDates(1); // Firma yoksa varsayılan 1 yıl
          return;
        }
  
        const filteredFirms = allFirms.filter(firm => normalizeString(firm).includes(filter));
        if (filteredFirms.length > 0) {
          firmListDiv.style.display = 'block';
          filteredFirms.forEach(firm => {
            const div = document.createElement("div");
            div.textContent = firm;
            div.className = "firm-option";
        
            div.onclick = function() {
              document.getElementById("firmSearchBox").value = firm;
              document.getElementById("selectedFirm").value = firm;
              selectedFirmExact = firm;
              firmListDiv.innerHTML = "";
              firmListDiv.style.display = 'none';
              // Firma seçilince tarihi güncelle
              google.script.run.withSuccessHandler(updateDependentDates).getHazardYearsForFirm(firm);
            };
            firmListDiv.appendChild(div);
          });
        } else {
          firmListDiv.style.display = 'none';
          document.getElementById("selectedFirm").value = "";
          updateDependentDates(1); // Firma bulunamazsa varsayılan 1 yıl
        }
        const exactMatch = allFirms.find(firm => normalizeString(firm) === filter);
        if (exactMatch) {
          document.getElementById("selectedFirm").value = exactMatch;
          selectedFirmExact = exactMatch;
          firmListDiv.style.display = 'none';
          // Firma seçilince tarihi güncelle
          google.script.run.withSuccessHandler(updateDependentDates).getHazardYearsForFirm(exactMatch);
        }
      });

      document.getElementById("certificateForm").addEventListener("submit", function(event) {
          event.preventDefault();

          const rowNumbersStr = document.getElementById("rowNumbers").value;
          if (!rowNumbersStr.trim()) {
              alert("Lütfen satır numaralarını girin.");
              return;
          }

          const templates = Array.from(document.querySelectorAll('#templatesCheckboxes input[type="checkbox"]:checked'))
          .map(cb => parseInt(cb.value));

          if (templates.length === 0) {
              alert("Lütfen en az bir şablon seçin.");
              return;
          }

          const selectedTopicNames = Array.from(document.querySelectorAll('#trainingTopicCheckboxes input[type="checkbox"]:checked'))
          .map(cb => cb.value);

          if (selectedTopicNames.length === 0) {
              alert("Lütfen en az bir eğitim konusu seçin.");
              return;
          }
          
          const firm = document.getElementById("selectedFirm").value;
          const trainingHours1 = document.getElementById("trainingHours1").value;
          const trainingHours2 = document.getElementById("trainingHours2").value;
          const trainingHours3 = document.getElementById("trainingHours3").value;
          const date1 = document.getElementById("date1").value;
          const date3 = document.getElementById("date3").value;
          const date5 = document.getElementById("date5").value;

          const progressMessageDiv = document.getElementById("progressMessage");
          progressMessageDiv.style.display = "block";
          const KATILAN_LISTESI_ID_VALUE = 5;
          let totalDocsCount = 0;
          if (templates.length === 1 && templates[0] === KATILAN_LISTESI_ID_VALUE) {
              totalDocsCount = 1;
              progressMessageDiv.textContent = `Katılımcı Listesi belgesi oluşturuluyor...`;
          } else {
              const rowNumbers = rowNumbersStr.split(',').reduce((acc, current) => {
                  const range = current.split('-');
                  if (range.length === 2) {
                      for (let i = parseInt(range[0]); i <= 
                      parseInt(range[1]); i++) {
                          acc.push(i);
                      }
                  } else {
                      acc.push(parseInt(current));
                      }
                  return acc;
              }, []);
              totalDocsCount = rowNumbers.length * templates.length;
              progressMessageDiv.textContent = `Toplam ${totalDocsCount} belge oluşturuluyor...`;
          }
          document.getElementById("resultMessage").style.display = "none";
          google.script.run
              .withSuccessHandler(function(report) {
                  progressMessageDiv.style.display = "none";
                  const resultMessageDiv = document.getElementById("resultMessage");
                  const resultParagraph = resultMessageDiv.querySelector("p");
                  resultMessageDiv.style.display = "block";

                  if (report.success) {
                      resultMessageDiv.style.color = "green";
                      resultParagraph.textContent = `✅ Bitti! ${report.totalDocsCreated} belge başarıyla oluşturuldu.`;
                  } else {
                      resultMessageDiv.style.color = "red";
                      let errorMessage = `⚠️ Bazı belgeler oluşturulamadı:\n\n`;
                      report.failedCreations.forEach(item => {
                          errorMessage += `- "${item.template}" şablonunda hata: ${item.error}\n`;
                      });
                      resultParagraph.textContent = errorMessage;
                  }
              })
              .withFailureHandler(function(error) {
                  const progressMessageDiv = document.getElementById("progressMessage");
                  progressMessageDiv.style.display = "block";
                  progressMessageDiv.style.color = "red";
                  progressMessageDiv.textContent = "Hata oluştu: " + error.message;
                  console.error(error);
              })
              .processFormWithRowNumbers(rowNumbersStr, templates, firm, date1, date3, date5, 
          trainingHours1, trainingHours2, trainingHours3, selectedTopicNames);
      });
      
      // İlk yüklemede ve firma seçimi değiştiğinde tarihleri güncellemek için dinleyiciler
      document.getElementById('date1').addEventListener('change', () => {
          const firmName = document.getElementById('selectedFirm').value;
          if (firmName) {
              google.script.run.withSuccessHandler(updateDependentDates).getHazardYearsForFirm(firmName);
          } else {
              updateDependentDates(1);
          }
      });
      document.getElementById('date3').addEventListener('change', () => {
          const firmName = document.getElementById('selectedFirm').value;
          if (firmName) {
              google.script.run.withSuccessHandler(updateDependentDates).getHazardYearsForFirm(firmName);
          } else {
              updateDependentDates(1);
          }
      });
      document.getElementById('date5').addEventListener('change', () => {
          const firmName = document.getElementById('selectedFirm').value;
          if (firmName) {
              google.script.run.withSuccessHandler(updateDependentDates).getHazardYearsForFirm(firmName);
          } else {
              updateDependentDates(1);
          }
      });
      document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        document.getElementById('date1').value = formatDateToDDMMYYYY(today);
        
        // Tehlike sınıfı için varsayılan yıl değeriyle başlat
        updateDependentDates(1);
      });
      
      // Tarih ve saat alanları için varsayılan değerleri ayarla
      document.addEventListener('DOMContentLoaded', function() {
        // Bugünün tarihi
        let today = new Date();
        
        // Bugün iş günü mü kontrol et, değilse bir önceki iş gününü bul
        if (today.getDay() === 0 || today.getDay() === 6) {
          today = getPreviousBusinessDay(today);
        }
        document.getElementById('date1').value = formatDateToDDMMYYYY(today);
        
        // İkinci ve üçüncü günleri ayarla
        let secondDay = getNextBusinessDay(today);
        document.getElementById('date3').value = formatDateToDDMMYYYY(secondDay);
        
        let thirdDay = getNextBusinessDay(secondDay);
        document.getElementById('date5').value = formatDateToDDMMYYYY(thirdDay);
        
        // Saatleri ayarla
        document.getElementById('trainingHours1').value = '8';
        document.getElementById('trainingHours2').value = '8';
        document.getElementById('trainingHours3').value = '4';
        
        // Firma seçilmediği için varsayılan 1 yıl ile geçerlilik tarihlerini güncelle
        updateDependentDates(1);
      });
    </script>
  </body>
</html>
