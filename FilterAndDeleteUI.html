<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f9;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 20px;
        }

        .warning-message {
            font-weight: 600;
            color: #c0392b;
            background-color: #fce4e4;
            padding: 12px;
            border: 1px solid #c0392b;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .info-message {
            text-align: center;
            color: #555;
            margin-bottom: 15px;
        }

        #filterInput {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        #filterInput:focus {
            outline: none;
            border-color: #3498db;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex-grow: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }

        #selectAllBtn {
            background-color: #27ae60;
            color: white;
        }

        #selectFilteredBtn {
            background-color: #3498db;
            color: white;
        }
        
        #deselectAllBtn {
            background-color: #95a5a6;
            color: white;
        }

        #dataList {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }

        #dataList p {
            text-align: center;
            color: #777;
            font-style: italic;
        }

        .selectItem {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
        }
        
        .selectItem:last-child {
            border-bottom: none;
        }

        .selectItem input[type="checkbox"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            outline: none;
        }
        
        .selectItem input[type="checkbox"]:checked {
            background-color: #27ae60;
            border-color: #27ae60;
        }
        
        .selectItem input[type="checkbox"]:checked::after {
            content: '✔';
            color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        .selectItem label {
            cursor: pointer;
            font-weight: 400;
        }

        .delete-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #submitAllRecordsDeletionBtn {
            background-color: #c0392b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Eski Kayıtları Sil 🗑️</h3>
        <div class="warning-message">
            Kendinize ait olan firmalardan işlemleri biten verileri siliniz!
        </div>
        <p class="info-message">Kayıtları eski olan firmaları seçerek silebilirsiniz.</p>
        
        <input type="text" id="filterInput" placeholder="Firma Adı Filtrele..." oninput="filterData()">

        <div class="button-group">
            <button id="selectAllBtn" onclick="selectAll()">Tümünü Seç</button>
            <button id="selectFilteredBtn" onclick="selectFiltered()">Filtrelenenleri Seç</button>
            <button id="deselectAllBtn" onclick="deselectAll()">Tümünü Kaldır</button>
        </div>
        
        <div id="dataList"></div>
        
        <div class="delete-buttons">
            <button id="submitAllRecordsDeletionBtn" onclick="submitAllRecordsDeletion()">Seçili Firmaların Kayıtlarını Sil</button>
        </div>
    </div>

    <script>
        let allFirms = [];

        function filterData() {
            let input = document.getElementById("filterInput").value.toLowerCase();
            let items = document.querySelectorAll("#dataList .selectItem");
            
            items.forEach(item => {
                let firmName = item.querySelector("label").textContent.toLowerCase();
                if (firmName.includes(input)) {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        }

        function selectAll() {
            document.querySelectorAll("#dataList input[type='checkbox']").forEach(el => el.checked = true);
        }

        function selectFiltered() {
            document.querySelectorAll("#dataList .selectItem").forEach(item => {
                if (item.style.display !== "none") {
                    item.querySelector("input[type='checkbox']").checked = true;
                }
            });
        }

        function deselectAll() {
            document.querySelectorAll("#dataList input[type='checkbox']").forEach(el => el.checked = false);
        }
        
        function updateList(firms) {
            allFirms = firms;
            let dataList = document.getElementById("dataList");
            dataList.innerHTML = '';
            if (allFirms.length === 0) {
                dataList.innerHTML = '<p>Silinebilecek eski kayıt bulunmuyor.</p>';
            } else {
                allFirms.forEach(firm => {
                    let div = document.createElement("div");
                    div.classList.add("selectItem");
                    div.innerHTML = `<input type="checkbox" value="${firm}" id="${firm}"><label for="${firm}">${firm}</label>`;
                    dataList.appendChild(div);
                });
            }
            filterData();
        }

        function submitAllRecordsDeletion() {
            let selectedValues = Array.from(document.querySelectorAll("#dataList input[type='checkbox']:checked")).map(input => input.value);
            
            if (selectedValues.length === 0) {
                alert("Lütfen silmek istediğiniz firmaları seçin.");
                return;
            }
            
            if (!confirm("Seçili firmalara ait TÜM kayıtlar silinecek. Bu işlem geri alınamaz! Emin misiniz?")) {
                return;
            }

            google.script.run
                .withSuccessHandler(function(updatedFirms) {
                    alert("Seçilen firmaların tüm kayıtları başarıyla silindi. Liste yenileniyor.");
                    updateList(updatedFirms);
                })
                .withFailureHandler(function(error) {
                    alert("Hata: " + error.message);
                })
                .deleteAllRecords(selectedValues);
        }

        // Initially load data
        google.script.run.withSuccessHandler(updateList).getUniqueOldFirms();
    </script>
</body>
</html>
